---
layout: default
---
<article class="post-content-wrapper">
  <header class="post-header">
    <div class="post-date">{{ page.date | date: "%Y.%m.%d" }}</div>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.tags %}
    <div class="post-tags">
      {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </header>

  {% if page.thumbnail %}
  <img class="post-hero" src="{{ page.thumbnail | relative_url }}" alt="{{ page.title }}">
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>
</article>

<nav class="post-nav">
  <a href="{{ '/' | relative_url }}" class="back-link">&larr; 목록으로 돌아가기</a>
</nav>
