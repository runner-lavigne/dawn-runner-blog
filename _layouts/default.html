<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    &copy; {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.
    &nbsp;·&nbsp; <a href="{{ '/about/' | relative_url }}">소개</a>
    &nbsp;·&nbsp; <a href="{{ '/privacy/' | relative_url }}">개인정보처리방침</a>
    &nbsp;·&nbsp; <a href="{{ '/contact/' | relative_url }}">문의</a>
  </footer>

  {% include theme-toggle.html %}
</body>
</html>
